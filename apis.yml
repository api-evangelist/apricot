aid: apricot
name: Apricot
description: 'Apricot is an AI-native clinical documentation platform for home health
  and post-acute care agencies, founded by home-health operator Trent Smith and headquartered
  in Oklahoma. Its software cuts start-of-care (SOC) and OASIS documentation time by
  up to 85% and QA time by up to 40%, automating medication reconciliation, wound
  documentation, ICD coding recommendations, and narrative generation while capturing
  vitals, photos, signatures, and voice notes in the home and syncing to each agency''s
  EMR configuration. Apricot is HIPAA and SOC 2 compliant and raised a Series A led
  by Insight Partners in 2025. This API Evangelist profile tracks the company''s public
  web presence; Apricot currently publishes no public API, developer portal, or SDKs.'
